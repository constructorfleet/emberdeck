name: Release
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      - name: Start required checks for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr list --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')
          if [ -n "$branch" ]; then
            gh workflow run ci.yml --ref "$branch"
            gh workflow run container.yml --ref "$branch"
            gh workflow run browser.yml --ref "$branch"
          fi
  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r docs/requirements.txt
      - run: sh scripts/check.sh
      - name: Build portable binaries
        env:
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p dist/bin
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 GOARM=7
            suffix=""; [ "$GOOS" != windows ] || suffix=.exe
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/bin/emberdeck-$GOOS-$GOARCH$suffix" ./cmd/emberdeck
          done
          cd dist/bin && sha256sum * > SHA256SUMS
      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/bin/* LICENSE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs
      - uses: actions/deploy-pages@v4
        id: deployment

  container:
    needs: [release, publish]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Resolve released source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/constructorfleet/emberdeck:${{ needs.release.outputs.tag }}
            ghcr.io/constructorfleet/emberdeck:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          provenance: mode=max
