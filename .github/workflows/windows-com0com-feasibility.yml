name: Windows virtual COM feasibility

# Exploratory only: com0com's signed driver is an old release and may be
# rejected by current Windows driver-signing policy. Never enable TESTSIGNING.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-com:
    name: Install and exercise pinned com0com package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify, install, exercise, and remove virtual COM pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'com0com-3.0.0.0-i386-and-x64-signed.zip'
          $archiveUrl = 'https://sourceforge.net/projects/com0com/files/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip/download'
          $expectedSha256 = '6e5d4359865277430d4ae88c73fb7e648a0ed8e81aea5002478179cfcb0bb0e1'
          $workDir = Join-Path $env:RUNNER_TEMP 'emberdeck-com0com-feasibility'
          $installDir = Join-Path $workDir 'installed'
          $archivePath = Join-Path $workDir $archiveName
          $extractDir = Join-Path $workDir 'package'
          $setupPath = Join-Path $extractDir 'Setup_com0com_v3.0.0.0_W7_x64_signed.exe'
          $setupcPath = Join-Path $installDir 'setupc.exe'
          $uninstallerPath = Join-Path $installDir 'uninstall.exe'
          $installStarted = $false
          $originalFailure = $null
          $cleanupFailures = @()

          function Invoke-CheckedProcess([string] $FilePath, [string[]] $ArgumentList) {
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "Process failed with exit code $($process.ExitCode): $FilePath $($ArgumentList -join ' ')"
            }
          }

          function Show-Com0comDeviceEvidence {
            $entities = @(Get-CimInstance Win32_PnPEntity | Where-Object {
              $_.Name -match 'com0com|CNCA0|CNCB0|COM10|COM11'
            })
            $signedDrivers = @(Get-CimInstance Win32_PnPSignedDriver | Where-Object {
              $_.DeviceName -match 'com0com|CNCA0|CNCB0|COM10|COM11'
            })
            if ($entities.Count -eq 0) {
              Write-Host 'Device evidence: no matching Win32_PnPEntity records found.'
            }
            foreach ($entity in $entities) {
              Write-Host ("Device status: Name='{0}' Status='{1}' Code={2} PNPDeviceID='{3}'" -f `
                $entity.Name, $entity.Status, $entity.ConfigManagerErrorCode, $entity.PNPDeviceID)
            }
            if ($signedDrivers.Count -eq 0) {
              Write-Host 'Signature evidence: no matching Win32_PnPSignedDriver records found.'
            }
            foreach ($driver in $signedDrivers) {
              Write-Host ("Driver signature: DeviceName='{0}' IsSigned={1} Signer='{2}' InfName='{3}' Version='{4}'" -f `
                $driver.DeviceName, $driver.IsSigned, $driver.Signer, $driver.InfName, $driver.DriverVersion)
            }
            return @{ Entities = $entities; SignedDrivers = $signedDrivers }
          }

          try {
            New-Item -ItemType Directory -Path $workDir -Force | Out-Null
            Write-Host "Exploratory Windows virtual COM feasibility run; package source: $archiveUrl"
            Write-Host "Pinned package SHA-256: $expectedSha256"
            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
            $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "Archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256. Refusing to install driver."
            }
            Write-Host "Verified archive SHA-256: $actualSha256"

            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir -Force
            if (-not (Test-Path -LiteralPath $setupPath)) {
              throw "Pinned archive did not contain the expected x64 installer: $setupPath"
            }

            $occupied = @(Get-CimInstance Win32_SerialPort | Where-Object { $_.DeviceID -in @('COM10', 'COM11') })
            if ($occupied.Count -gt 0) {
              throw "COM10 or COM11 is already present; refusing to claim or alter an existing port."
            }

            # Silent installation creates the default CNCA0/CNCB0 pair when this
            # package-specific environment variable is set. No signing policy is changed.
            $env:CNC_INSTALL_CNCA0_CNCB0_PORTS = 'YES'
            $installStarted = $true
            Invoke-CheckedProcess -FilePath $setupPath -ArgumentList @('/S', "/D=$installDir")
            Remove-Item Env:\CNC_INSTALL_CNCA0_CNCB0_PORTS -ErrorAction SilentlyContinue

            if (-not (Test-Path -LiteralPath $setupcPath)) {
              throw "Installer returned success but setupc.exe is missing at $setupcPath"
            }
            Invoke-CheckedProcess -FilePath $setupcPath -ArgumentList @('change', 'CNCA0', 'PortName=COM10')
            Invoke-CheckedProcess -FilePath $setupcPath -ArgumentList @('change', 'CNCB0', 'PortName=COM11')
            & $setupcPath list
            if ($LASTEXITCODE -ne 0) { throw "setupc list failed with exit code $LASTEXITCODE" }

            Start-Sleep -Seconds 3
            $evidence = Show-Com0comDeviceEvidence
            $badEntities = @($evidence.Entities | Where-Object { $_.ConfigManagerErrorCode -ne 0 -or $_.Status -ne 'OK' })
            $unsignedDrivers = @($evidence.SignedDrivers | Where-Object { -not $_.IsSigned })
            if ($evidence.Entities.Count -lt 2 -or $badEntities.Count -gt 0 -or
                $evidence.SignedDrivers.Count -lt 1 -or $unsignedDrivers.Count -gt 0) {
              throw 'com0com ports are not present and healthy with a signed driver. See the device status, problem code, and signature evidence above; Windows driver policy may have rejected the package (for example, Code 52). TESTSIGNING was not enabled.'
            }

            $goTestExitCode = $null
            try {
              $env:EMBERDECK_WINDOWS_COM_SMOKE = '1'
              go test ./transport -run '^TestWindowsVirtualCOMPairRoundTrip$' -count=1 -v
              $goTestExitCode = $LASTEXITCODE
            }
            finally {
              Remove-Item Env:\EMBERDECK_WINDOWS_COM_SMOKE -ErrorAction SilentlyContinue
            }
            if ($goTestExitCode -ne 0) {
              throw "Production Windows virtual COM integration test failed with exit code $goTestExitCode."
            }

            $portA = [System.IO.Ports.SerialPort]::new('COM10', 115200, [System.IO.Ports.Parity]::None, 8, [System.IO.Ports.StopBits]::One)
            $portB = [System.IO.Ports.SerialPort]::new('COM11', 115200, [System.IO.Ports.Parity]::None, 8, [System.IO.Ports.StopBits]::One)
            try {
              $portA.ReadTimeout = 5000
              $portB.ReadTimeout = 5000
              $portA.Open()
              $portB.Open()
              $payload = 'emberdeck-com0com-feasibility'
              $portA.WriteLine($payload)
              $received = $portB.ReadLine()
              if ($received -ne $payload) {
                throw "Virtual COM data mismatch: expected '$payload', received '$received'."
              }
              Write-Host "PASS: COM10 -> COM11 transferred '$received'."
            }
            finally {
              if ($portA.IsOpen) { $portA.Close() }
              if ($portB.IsOpen) { $portB.Close() }
              $portA.Dispose()
              $portB.Dispose()
            }
          }
          catch {
            $originalFailure = $_
            Write-Host "ERROR: $_"
            if ($installStarted) {
              # Capture failure evidence too, including installer failures and
              # devices that exist but Windows refuses to start (for example, Code 52).
              Show-Com0comDeviceEvidence | Out-Null
            }
          }
          finally {
            Remove-Item Env:\CNC_INSTALL_CNCA0_CNCB0_PORTS -ErrorAction SilentlyContinue
            if ($installStarted -and (Test-Path -LiteralPath $setupcPath)) {
              try {
                & $setupcPath remove CNCA0 CNCB0
                if ($LASTEXITCODE -ne 0) { throw "setupc remove exited with code $LASTEXITCODE" }
                Write-Host 'Removed the temporary CNCA0/CNCB0 virtual port pair.'
              }
              catch {
                $cleanupFailures += "Could not remove the temporary port pair: $_"
              }
            }
            if ($installStarted -and (Test-Path -LiteralPath $uninstallerPath)) {
              try {
                Invoke-CheckedProcess -FilePath $uninstallerPath -ArgumentList @('/S')
                Write-Host 'Ran the package uninstaller.'
              }
              catch {
                $cleanupFailures += "Could not uninstall com0com: $_"
              }
            }
            if ($installStarted) {
              $remaining = @(Get-CimInstance Win32_PnPEntity | Where-Object {
                $_.Name -match 'com0com|CNCA0|CNCB0|COM10|COM11'
              })
              if ($remaining.Count -gt 0) {
                foreach ($device in $remaining) {
                  Write-Host ("After cleanup: Name='{0}' Status='{1}' Code={2} PNPDeviceID='{3}'" -f `
                    $device.Name, $device.Status, $device.ConfigManagerErrorCode, $device.PNPDeviceID)
                }
                $cleanupFailures += 'One or more matching devices remain after uninstall.'
              }
            }
            if ($cleanupFailures.Count -gt 0) {
              foreach ($failure in $cleanupFailures) { Write-Host "CLEANUP ERROR: $failure" }
              if ($null -eq $originalFailure) { $originalFailure = 'com0com cleanup was incomplete.' }
            }
          }

          if ($null -ne $originalFailure) { throw $originalFailure }
