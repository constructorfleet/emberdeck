name: Container
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Compose serial smoke harness
        run: python3 -m unittest scripts/tests/test_docker_compose_serial_smoke.py
      - name: Build and exercise container
        run: python3 scripts/container-smoke.py
      - name: Exercise serial Compose profile image and configuration
        run: python3 scripts/docker_compose_serial_smoke.py
