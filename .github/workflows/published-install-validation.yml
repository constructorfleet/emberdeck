name: Published install validation
on:
  schedule:
    - cron: '31 8 * * 3'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/published-install-validation.yml'
      - 'docs/install.md'
      - 'docs/deployment.md'
      - 'scripts/container-smoke.py'
      - 'scripts/tests/test_container_smoke.py'
      - 'scripts/docker_pty_permission_smoke.py'
      - 'scripts/tests/test_docker_pty_permission_smoke.py'
      - 'scripts/lxc_install_smoke.py'
      - 'scripts/tests/test_lxc_install_smoke.py'
      - 'scripts/release_install_smoke.py'
      - 'scripts/tests/test_release_install_smoke.py'
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test published install smoke helpers
        run: python -m unittest discover -s scripts/tests -p 'test_*smoke.py'

  published-binaries:
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: emberdeck-linux-amd64
          - os: ubuntu-latest
            asset: emberdeck-linux-arm64
            qemu: true
          - os: macos-latest
            asset: emberdeck-darwin-arm64
          - os: windows-latest
            asset: emberdeck-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Register Linux ARM64 emulation
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Select the asset matching this runner architecture
        id: native-asset
        env:
          DEFAULT_ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          asset="$DEFAULT_ASSET"
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$(uname -m)" in
              arm64|aarch64) asset=emberdeck-darwin-arm64 ;;
              x86_64|amd64) asset=emberdeck-darwin-amd64 ;;
              *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
            esac
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Select the two newest published releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tags=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft == false) | .tag_name] | .[0:2] | @tsv')
          read -r current previous <<< "$tags"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "Two published releases with migration history are required" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Validating $previous -> $current on $RUNNER_OS"
      - name: Download the documented native assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ steps.releases.outputs.current }}
          PREVIOUS: ${{ steps.releases.outputs.previous }}
          ASSET: ${{ steps.native-asset.outputs.asset }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-current" "$RUNNER_TEMP/release-previous"
          gh release download "$CURRENT" --repo "$GH_REPO" --pattern "$ASSET" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release-current"
          gh release download "$PREVIOUS" --repo "$GH_REPO" --pattern "$ASSET" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release-previous"
      - name: Verify checksums, first start, upgrade, restart, and uninstall
        env:
          CURRENT: ${{ steps.releases.outputs.current }}
          PREVIOUS: ${{ steps.releases.outputs.previous }}
          ASSET: ${{ steps.native-asset.outputs.asset }}
        shell: bash
        run: |
          python scripts/release_install_smoke.py \
            --previous-binary "$RUNNER_TEMP/release-previous/$ASSET" \
            --previous-version "$PREVIOUS" \
            --previous-checksums "$RUNNER_TEMP/release-previous/SHA256SUMS" \
            --current-binary "$RUNNER_TEMP/release-current/$ASSET" \
            --current-version "$CURRENT" \
            --current-checksums "$RUNNER_TEMP/release-current/SHA256SUMS"

  published-container:
    if: github.event_name != 'pull_request'
    name: Published container install
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Select the two newest published releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tags=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft == false) | .tag_name] | .[0:2] | @tsv')
          read -r current previous <<< "$tags"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "Two published releases with container images are required" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Validating published container upgrade $previous -> $current on linux/amd64"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the two published release images
        env:
          PREVIOUS: ${{ steps.releases.outputs.previous }}
          CURRENT: ${{ steps.releases.outputs.current }}
        run: |
          for attempt in {1..12}; do
            if docker pull --platform linux/amd64 "ghcr.io/constructorfleet/emberdeck:$PREVIOUS" && \
               docker pull --platform linux/amd64 "ghcr.io/constructorfleet/emberdeck:$CURRENT"; then
              exit 0
            fi
            echo "Release images are not ready yet (attempt $attempt/12); retrying in 30 seconds"
            sleep 30
          done
          echo "Could not pull both published release images" >&2
          exit 1
      - name: Verify first start, login, dispatch, restart, upgrade, and cleanup
        env:
          PREVIOUS: ${{ steps.releases.outputs.previous }}
          CURRENT: ${{ steps.releases.outputs.current }}
        run: |
          python3 scripts/container-smoke.py \
            --previous-image "ghcr.io/constructorfleet/emberdeck:$PREVIOUS" \
            --previous-version "$PREVIOUS" \
            --current-image "ghcr.io/constructorfleet/emberdeck:$CURRENT" \
            --current-version "$CURRENT"
      - name: Verify Linux Docker PTY permissions
        run: python3 scripts/docker_pty_permission_smoke.py

  lxc-feasibility:
    if: github.event_name != 'pull_request'
    name: Published Linux install and services in classic LXC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install classic LXC
        run: |
          sudo apt-get update
          sudo apt-get install --yes lxc lxc-templates uidmap
      - name: Record runner capabilities
        run: |
          uname -a
          lxc-info --version
          stat -fc 'host filesystem: %T' /sys/fs/cgroup
          cat /proc/self/uid_map
          sudo lxc-checkconfig || true
      - name: Select the two newest published releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tags=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select(.draft == false) | .tag_name] | .[0:2] | @tsv')
          read -r current previous <<< "$tags"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "Two published releases are required for LXC upgrade validation" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Validating LXC install upgrade $previous -> $current"
      - name: Download published Linux binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.releases.outputs.previous }}
          CURRENT: ${{ steps.releases.outputs.current }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lxc-release-previous" "$RUNNER_TEMP/lxc-release-current"
          gh release download "$PREVIOUS" --repo "$GH_REPO" \
            --pattern emberdeck-linux-amd64 --pattern SHA256SUMS --dir "$RUNNER_TEMP/lxc-release-previous"
          gh release download "$CURRENT" --repo "$GH_REPO" \
            --pattern emberdeck-linux-amd64 --pattern SHA256SUMS --dir "$RUNNER_TEMP/lxc-release-current"
      - name: Boot Ubuntu system guest and validate published install and services
        shell: bash
        run: |
          set -euo pipefail
          name=emberdeck-lxc-feasibility
          cleanup() {
            sudo lxc-stop --name "$name" --kill 2>/dev/null || true
            sudo lxc-destroy --name "$name" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo lxc-create --name "$name" --template download --config /etc/lxc/default.conf -- \
            --dist ubuntu --release noble --arch amd64
          sudo sed -i '/^lxc.net\./d' "/var/lib/lxc/$name/config"
          echo 'lxc.net.0.type = empty' | sudo tee -a "/var/lib/lxc/$name/config" >/dev/null
          echo 'lxc.start.auto = 1' | sudo tee -a "/var/lib/lxc/$name/config" >/dev/null
          sudo lxc-start --name "$name" --daemon \
            --logfile "$RUNNER_TEMP/lxc-start.log" --logpriority INFO
          for attempt in $(seq 1 60); do
            state=$(sudo lxc-info --name "$name" --state | awk '{print $NF}')
            if [ "$state" = RUNNING ]; then
              break
            fi
            sleep 1
          done
          if [ "${state:-}" != RUNNING ]; then
            sudo lxc-info --name "$name" --state
            sudo cat "$RUNNER_TEMP/lxc-start.log" || true
            exit 1
          fi
          for attempt in $(seq 1 30); do
            health=$(sudo lxc-attach --name "$name" -- systemctl is-system-running || true)
            case "$health" in
              running|degraded) break ;;
            esac
            sleep 1
          done
          echo "Guest systemd state: $health"
          case "$health" in
            running|degraded) ;;
            *) exit 1 ;;
          esac
          sudo lxc-attach --name "$name" -- systemctl is-active systemd-journald
          sudo lxc-attach --name "$name" -- apt-get update
          sudo lxc-attach --name "$name" -- apt-get install --yes python3
          sudo python3 scripts/lxc_install_smoke.py \
            --container "$name" \
            --previous-binary "$RUNNER_TEMP/lxc-release-previous/emberdeck-linux-amd64" \
            --previous-version "${{ steps.releases.outputs.previous }}" \
            --previous-checksums "$RUNNER_TEMP/lxc-release-previous/SHA256SUMS" \
            --current-binary "$RUNNER_TEMP/lxc-release-current/emberdeck-linux-amd64" \
            --current-version "${{ steps.releases.outputs.current }}" \
            --current-checksums "$RUNNER_TEMP/lxc-release-current/SHA256SUMS"
