services:
  emberdeck:
    build: .
    image: emberdeck:local
    restart: unless-stopped
    environment:
      EMBERDECK_API_KEY: ${EMBERDECK_API_KEY:?Set EMBERDECK_API_KEY in the environment}
      EMBERDECK_LOG_LEVEL: ${EMBERDECK_LOG_LEVEL:-info}
      EMBERDECK_LOG_FORMAT: ${EMBERDECK_LOG_FORMAT:-text}
    ports:
      - "8080:8080"
    volumes:
      - emberdeck-data:/data
    command: ["serve", "-listen", "0.0.0.0:8080", "-data", "/data"]
    # Optional private monitoring example (disabled by default): add the metrics
    # key under environment, add this item under the existing ports list, and
    # replace command with the following:
    #   EMBERDECK_METRICS_KEY: ${EMBERDECK_METRICS_KEY:?Set a separate metrics secret}
    #   - "127.0.0.1:9090:9090"
    # command: ["serve", "-listen", "0.0.0.0:8080", "-metrics-listen", "0.0.0.0:9090", "-data", "/data"]

  # Deliberate software-only demonstration; omit this profile for normal use.
  demo:
    profiles: ["demo"]
    build: .
    image: emberdeck:local
    restart: unless-stopped
    environment:
      EMBERDECK_API_KEY: ${EMBERDECK_API_KEY:?Set EMBERDECK_API_KEY in the environment}
      EMBERDECK_LOG_LEVEL: ${EMBERDECK_LOG_LEVEL:-info}
      EMBERDECK_LOG_FORMAT: ${EMBERDECK_LOG_FORMAT:-text}
    ports:
      - "8080:8080"
    volumes:
      - emberdeck-demo-data:/data
    command: ["serve", "-listen", "0.0.0.0:8080", "-data", "/data", "-simulate"]

  # Remote controller worker. Enable with `--profile driver`; see
  # docs/deployment.md. EMBERDECK_CONTROLLER_TCP is required for this profile;
  # without it the worker exits with a usage error and keeps restarting.
  driver:
    profiles: ["driver"]
    build: .
    image: emberdeck:local
    restart: always
    environment:
      EMBERDECK_API_KEY: ${EMBERDECK_API_KEY:?Set EMBERDECK_API_KEY in the environment}
      EMBERDECK_LOG_LEVEL: ${EMBERDECK_LOG_LEVEL:-info}
      EMBERDECK_LOG_FORMAT: ${EMBERDECK_LOG_FORMAT:-text}
    command:
      - driver
      - -server
      - ${EMBERDECK_SERVER_URL:-http://emberdeck:8080}
      - -id
      - ${EMBERDECK_DRIVER_ID:-bench}
      - -tcp
      - ${EMBERDECK_CONTROLLER_TCP:-}

  # Linux serial worker. Map the host device and its numeric group explicitly;
  # see docs/deployment.md#docker-compose for setup and platform limits.
  serial-driver:
    profiles: ["serial"]
    build: .
    image: ${EMBERDECK_SERIAL_IMAGE:-emberdeck:local}
    restart: always
    environment:
      EMBERDECK_API_KEY: ${EMBERDECK_DRIVER_API_KEY:-not-configured}
      EMBERDECK_LOG_LEVEL: ${EMBERDECK_LOG_LEVEL:-info}
      EMBERDECK_LOG_FORMAT: ${EMBERDECK_LOG_FORMAT:-text}
    group_add:
      - ${EMBERDECK_SERIAL_GID:-65534}
    devices:
      - ${EMBERDECK_SERIAL_DEVICE:-/dev/emberdeck-serial-device}:${EMBERDECK_SERIAL_DEVICE:-/dev/emberdeck-serial-device}:rw
    command:
      - driver
      - -server
      - ${EMBERDECK_SERVER_URL:-http://emberdeck:8080}
      - -id
      - ${EMBERDECK_DRIVER_ID:-bench}
      - -serial
      - ${EMBERDECK_SERIAL_DEVICE:-/dev/emberdeck-serial-device}
      - -baud
      - ${EMBERDECK_SERIAL_BAUD:-115200}
      - -serial-dtr
      - ${EMBERDECK_SERIAL_DTR:-off}
      - -serial-rts
      - ${EMBERDECK_SERIAL_RTS:-off}

volumes:
  emberdeck-data:
  emberdeck-demo-data:
